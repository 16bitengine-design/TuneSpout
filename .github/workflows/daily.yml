name: Make and post a lesson video

# Two videos a day on each platform. Video 1 is due from 06:17 UTC and video 2 from 13:17 UTC.
# GitHub often skips or delays scheduled runs, so instead of relying on one run per video this
# workflow wakes up every hour. Each wake-up posts any video that is due and not yet posted,
# and does nothing otherwise (a record in the `state` branch stops any double posting).
# Odd minutes avoid the top of the hour, when GitHub is busiest.
# Changing this file also triggers one catch-up run, so a missed day can be fixed with a commit.
on:
  schedule:
    - cron: "17 6 * * *"    # video 1 on time
    - cron: "17 13 * * *"   # video 2 on time
    - cron: "37 * * * *"    # hourly catch-up: posts anything due that was missed
  push:
    branches: [main]
    paths: [".github/workflows/daily.yml"]
  workflow_dispatch:
    inputs:
      topic:
        description: "Lesson topic (auto rotates through all of them)"
        type: choice
        default: auto
        options: [auto, counting, addition, subtraction, multiplication, division, plurals, sports, teamscore, fairplay, animalsounds, babyanimals, phonics, spelling, planning, kindwords, findingout, leadership, reporting]
      minutes:
        description: "Lesson length in minutes, or auto (each topic has its own range). Over 3 minutes is cut into parts."
        type: string
        default: auto
      force:
        description: "Post again even if today's video was already posted"
        type: boolean
        default: false

concurrency:
  group: daily-post
  cancel-in-progress: false

permissions:
  contents: write   # saves the daily record to the state branch
  issues: write     # opens an issue if posting fails

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # a platform is skipped until its secrets are added
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}   # optional: found automatically
      BUFFER_TIKTOK_CHANNEL_ID: ${{ secrets.BUFFER_TIKTOK_CHANNEL_ID }}     # optional: found automatically
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      TOPIC: ${{ inputs.topic || 'auto' }}
      MINUTES: ${{ inputs.minutes || vars.LESSON_MINUTES || 'auto' }}   # auto = by topic; the repo variable LESSON_MINUTES can force one length
    steps:
      - uses: actions/checkout@v4
      - name: Check out the daily record
        uses: actions/checkout@v4
        with:
          ref: state
          path: state
      - name: What is still to post today?
        id: status
        run: |
          echo "DAY=$(date -u +%F)" >> "$GITHUB_ENV"
          # scheduled and push-triggered runs post whatever is due and still missing; a hand-started
          # run makes the first video still missing today, due or not
          case "${{ github.event_name }}" in
            schedule|push) export CATCH_UP=1 ;;
          esac
          export DAY=$(date -u +%F)
          python3 src/state.py status ${{ inputs.force && '--force' || '' }} | tee /tmp/status.txt
          echo "SLOT=$(grep '^slot=' /tmp/status.txt | cut -d= -f2)" >> "$GITHUB_ENV"

      # Everything below is skipped when today's video is already posted
      - uses: actions/setup-python@v5
        if: steps.status.outputs.pending == 'true'
        with:
          python-version: "3.11"
          cache: pip
      - name: Remember the Kokoro voice model between runs
        if: steps.status.outputs.pending == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-model-v1
      - name: System packages (ffmpeg, espeak for Kokoro, fonts)
        if: steps.status.outputs.pending == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Python packages (CPU-only torch keeps the download small)
        if: steps.status.outputs.pending == 'true'
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Generate today's lesson (nothing is stored in the repo)
        if: steps.status.outputs.pending == 'true'
        run: python src/generate_lesson.py --topic "$TOPIC" --minutes "$MINUTES" --out out/lesson.json
      - name: Build videos, thumbnail, descriptions and hashtags
        if: steps.status.outputs.pending == 'true'
        run: python src/make_video.py out/lesson.json
      - name: Keep a copy of the files
        if: steps.status.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/
          retention-days: 7

      - name: Post to YouTube (through Buffer)
        if: steps.status.outputs.youtube == 'todo'
        continue-on-error: true   # a YouTube problem must not stop TikTok
        env:
          PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}   # set the repo variable YT_PRIVACY to private to hold videos back
        run: python src/buffer_post.py youtube out
      - name: Record YouTube
        if: steps.status.outputs.youtube == 'todo'
        run: python3 src/state.py record youtube out/result_youtube.json && tools/push_state.sh

      - name: Post to TikTok (through Buffer)
        if: steps.status.outputs.tiktok == 'todo'
        continue-on-error: true
        env:
          TIKTOK_MODE: ${{ vars.TIKTOK_MODE || 'post' }}   # post = goes live; set to draft to review in Buffer first
        run: python src/buffer_post.py tiktok out
      - name: Record TikTok
        if: steps.status.outputs.tiktok == 'todo'
        run: python3 src/state.py record tiktok out/result_tiktok.json && tools/push_state.sh

      - name: Save the daily record
        if: always() && steps.status.outputs.pending == 'true'
        run: tools/push_state.sh
      - name: Fail the run if a connected platform is still missing
        if: steps.status.outputs.pending == 'true'
        run: python3 src/state.py verify

      - name: Open an issue so you hear about it
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          OPEN=$(gh issue list --state open --search "Daily post failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$OPEN" ]; then
            gh issue comment "$OPEN" --body "Failed again on $DAY: $RUN"
          else
            gh issue create --title "Daily post failed" \
              --body "The daily video did not post on $DAY. Details: $RUN. A backup run tries again later today. Open the run to see which step failed."
          fi
